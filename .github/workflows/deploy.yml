name: React Automated Frontend Deployment

on:
  push:
    branches:
      - main  # Jab bhi aap frontend main branch par push karenge, pipeline chal paregi

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Executing Remote SSH Commands to Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 11092
          script: |
            # ⚠️ APNE FRONTEND FOLDER KA SAHI PATH YAHAN LIKHNA
            cd /www/wwwroot/gradewiseaiv2.techmiresolutions.com
            
            # 1. Fresh frontend code pull karna
            git fetch --alls
            git reset --hard origin/main
            
            # 2. Packages install karna aur production build banana
            npm install
            npm run build
            
            echo "🚀 Live Frontend Deployment Successful!"