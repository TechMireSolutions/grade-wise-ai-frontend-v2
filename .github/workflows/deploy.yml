name: React Automated Frontend Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies & Build React App
        run: |
          npm install
          npm run build

      - name: Deploy Built Files via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 11092
          source: "dist/*"
          target: "/www/wwwroot/gradewiseaiv2.techmiresolutions.com"
          strip_components: 1

      - name: Clean up Old Files on Server via SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 11092
          script: |
            cd /www/wwwroot/gradewiseaiv2.techmiresolutions.com
            # Agar purani pull ki hui फालतू source files pari hain to unhein saaf karo
            rm -rf src public package.json vite.config.js package-lock.json